[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "exoflow"
version = "0.1.0"
description = "Multi-agent software engineering orchestration with a deterministic state machine core"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
exoflow = "exoflow.cli:main"
exoflow-native-mcp = "exoflow.native_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exoflow = [
  "config/*.json",
  "fixtures/demo-service/README.md",
  "fixtures/demo-service/src/*.py",
  "fixtures/demo-service/tests/*.py",
  "fixtures/demo-service/hidden_tests/*.py",
  "samples/*.json"
]
