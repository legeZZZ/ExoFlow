[metadata]
name = exoflow
version = 0.1.0
description = Multi-agent software engineering orchestration with a deterministic state machine core

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
goai_control_tower =
    config/*.json
    fixtures/track1/demo-service/README.md
    fixtures/track1/demo-service/src/*.py
    fixtures/track1/demo-service/tests/*.py
    fixtures/track1/demo-service/hidden_tests/*.py
    samples/track1/*.json
    samples/track2/*.json

[options.entry_points]
console_scripts =
    goai-demo = goai_control_tower.cli:main
